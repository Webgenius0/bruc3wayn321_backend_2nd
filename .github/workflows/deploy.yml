name: Deploy to client server branch main

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd /home/joinrootsandroutes-admin/htdocs/admin.joinrootsandroutes.com

            # 1. Maintenance mode
            php artisan down --retry=60 || true
            # 2. Pull fresh code from Git
            git fetch origin main
            git reset --hard origin/main
            # 3. Dependencies & Frontend Build
            composer install --no-dev --optimize-autoloader --no-interaction
            pnpm install
            pnpm run build
            # 4. Database & Optimization
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize
            # 5. Restart Workers
            php artisan queue:restart
            php artisan reverb:restart
            # 6. Bring app back online
            php artisan up
            echo "Deploy done successfully!"
